[workspace]
resolver = "2"
members = [
    "crates/dweb-fabric",
    "crates/dweb-server",
    "crates/spike-iroh",
    "packages/client-sdk",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Gaubee/dweb"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
bytes = "1"
iroh = "=1.1.0"
iroh-relay = { version = "=1.1.0", features = ["server"] }
iroh-base = "=1.1.0"
blake3 = "1"
argon2 = "0.5"
zeroize = "1"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
uuid = { version = "1", features = ["v7"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
napi = { version = "3", default-features = false, features = ["napi4", "async"] }
napi-derive = "3"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
# 不得用 cargo 的 strip（true/"debuginfo" 均会）：rustc 把 strip 交给链接器
# 执行，对本 cdylib 会产出 "mis-aligned LINKEDIT string pool" 的坏 Mach-O
# （dyld 拒载、逐字节确定性复现——真双机验收第二轮实证 2026-09-29；触发
# 面随符号分布漂移，此前构建侥幸通过）。瘦身改由 client-sdk 的 build 脚本
# 后处理（/usr/bin/strip -Sx + ad-hoc codesign——实证安全），链接器产物
# 保持完整。
strip = false
