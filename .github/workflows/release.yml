# 正交意图（维护于 2026-09-06 Asia/Shanghai，openspec/changes/
# 2026-09-06-release-automation-and-copy）：
#   1. tag v* → mingw 交叉编译新鲜 Windows 产物（exe + napi dll）
#   2. tag v* → npm 发布（OIDC trusted publishing；单包 patch skip 守卫）
#   3. npm 发布成功 → 自动创建同名 GitHub Release（L1：jixoai.com 读
#      latest release 显示版本号；notes=按包提炼 + 版本表 + 升级行 + docker 引用）
#   4. workflow_dispatch release_current=true → 「补切当前版本 Release」引导
#      模式（跳过构建与发布，仅解析 tag → 生成 notes → 创建 Release）
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_current:
        description: "Bootstrap mode: cut the GitHub Release for the current version (no build, no publish — notes only)"
        required: false
        type: boolean
        default: false
      tag:
        description: "Bootstrap target tag (default: v<packages/opendweb version>; must already exist)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write # npm OIDC trusted publishing

jobs:
  build-windows:
    # tag push 时 mingw 交叉编译出新鲜 Windows 产物，替代 in-repo 手动提交的旧文件。
    # 引导模式（release_current=true）只补切 Release，不需要这份重量级构建。
    if: inputs.release_current != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 覆盖 .cargo/config.toml 的本机绝对路径 target-dir（同 ci.yml 做法）
      CARGO_TARGET_DIR: /tmp/cargo-target-win
      # node.exe 源版本：CI 从它重建 libnode 导入库（本地 ~/libnode-win 同为 v22.20.0 生成）
      NODE_WIN_VERSION: 22.20.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install mingw toolchain
        # gendef 在 mingw-w64-tools；dlltool/ar 在 binutils-mingw-w64-x86-64；
        # gcc（.cargo/config.toml 配置的 linker）在 gcc-mingw-w64-x86-64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 mingw-w64-tools
      # napi-build 的 setup_gnu() 要求 LIBNODE_PATH 目录下存在字面名为 libnode.dll
      # 的文件（存在性检查通过后 rustc-link-lib=node，GNU ld 实际链接 libnode.dll.a）
      - name: Cache node import library
        id: libnode
        uses: actions/cache@v4
        with:
          path: ~/libnode-win
          key: libnode-win-x64-v1-node${{ env.NODE_WIN_VERSION }}
      - name: Rebuild node import library (gendef + dlltool)
        if: steps.libnode.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/libnode-win"
          cd "$HOME/libnode-win"
          curl -fsSLO "https://nodejs.org/dist/v${NODE_WIN_VERSION}/node-v${NODE_WIN_VERSION}-win-x64.zip"
          unzip -o "node-v${NODE_WIN_VERSION}-win-x64.zip" "node-v${NODE_WIN_VERSION}-win-x64/node.exe"
          gendef "node-v${NODE_WIN_VERSION}-win-x64/node.exe"
          x86_64-w64-mingw32-dlltool -m i386:x86-64 -d node.def -l libnode.dll.a
          # node.exe 本身就是导出这些符号的 PE，重命名即满足 napi-build 的 libnode.dll 检查
          cp "node-v${NODE_WIN_VERSION}-win-x64/node.exe" libnode.dll
          rm -f "node-v${NODE_WIN_VERSION}-win-x64.zip"
          rm -rf "node-v${NODE_WIN_VERSION}-win-x64"
      - name: Build dweb-server (windows exe)
        run: cargo build --release --target x86_64-pc-windows-gnu -p dweb-server
      - name: Build dweb-client-sdk (napi dll)
        run: LIBNODE_PATH="$HOME/libnode-win" cargo build --release --target x86_64-pc-windows-gnu -p dweb-client-sdk
      - name: Stage artifacts (release names)
        # cdylib 产物名带下划线（dweb_client_sdk.dll），拷贝/重命名为 packages 期望的文件名
        run: |
          mkdir -p dist
          cp "$CARGO_TARGET_DIR/x86_64-pc-windows-gnu/release/dweb-server.exe" dist/dweb-server-x86_64-pc-windows.exe
          cp "$CARGO_TARGET_DIR/x86_64-pc-windows-gnu/release/dweb_client_sdk.dll" dist/dweb.win32-x64.node
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/
          if-no-files-found: error

  publish-npm:
    needs: build-windows
    # workflow_dispatch 时 GITHUB_REF_NAME 是分支名，依赖 pin 会得到 ^main——
    # 发布只允许 tag 触发（手动触发仅构建 Windows 产物）
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm trusted publishing 需要 npm >= 11.5（OIDC 免 token）
      - run: npm install -g npm@latest
      - name: Download CI-built Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist-windows
      # CI 新鲜产物覆盖 in-repo 旧文件（原为本地手动 mingw 构建后提交）
      - name: Replace in-repo Windows artifacts with CI builds
        run: |
          cp dist-windows/dweb-server-x86_64-pc-windows.exe packages/server-binary/bin/dweb-server-x86_64-pc-windows.exe
          cp dist-windows/dweb.win32-x64.node packages/client-sdk/dweb.win32-x64.node
      - name: Verify packaged artifacts
        run: |
          test -f packages/client-sdk/dweb.darwin-arm64.node
          test -f packages/client-sdk/dweb.win32-x64.node
          test -f packages/server-binary/bin/dweb-server-aarch64-apple-darwin
          test -f packages/server-binary/bin/dweb-server-x86_64-pc-windows.exe
      # R2：tarball 内容物门禁——files 数组笔误曾让 v0.2.1 的 npm 包漏掉
      # （npm notice 清单在 stderr，tee 须并流 2>&1，v0.3.0 首发实测）
      # Windows exe（test -f 只验证仓库文件存在，不验证打包清单）
      - name: Verify npm tarball manifests
        run: |
          cd packages/server-binary && npm pack --dry-run 2>&1 | tee /tmp/sb.log
          grep -q "bin/dweb-server-aarch64-apple-darwin" /tmp/sb.log
          grep -q "bin/dweb-server-x86_64-pc-windows.exe" /tmp/sb.log
          cd ../client-sdk && npm pack --dry-run 2>&1 | tee /tmp/sdk.log
          grep -q "dweb.darwin-arm64.node" /tmp/sdk.log
          grep -q "dweb.win32-x64.node" /tmp/sdk.log
      # ext-cf 的 dist 不入库（gitignored）：CI 安装 workspace 依赖后构建，
      # pack:dry 门禁一步完成 build + 依赖清单断言 + bundle 残留 grep。
      # 必须先于 Pin workspace deps：pin 会改写 package.json 的依赖声明，
      # frozen-lockfile 安装要求两者一致（v0.3.2 首发实测教训）
      - name: Build & gate @jixo/opendweb-ext-cf
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @jixo/opendweb-ext-cf run pack:dry
      # npm 不替换 workspace:* 协议（pnpm 才会），发布前固定为实际版本。
      # pin 目标包自身的 version 字段而非 tag 版本（v0.3.3 教训：skip 守卫下
      # 单包 patch 只发 opendweb，pin ^<tag> 指向永不存在的 server-binary 版本，
      # 消费者 npx 直接 notarget）
      - name: Pin workspace deps to released version
        run: |
          VER_SDK="$(node -p "require('./packages/client-sdk/package.json').version")"
          VER_SB="$(node -p "require('./packages/server-binary/package.json').version")"
          npm pkg set 'dependencies.@jixo/opendweb-client-sdk=^'"$VER_SDK" --prefix packages/example
          npm pkg set 'dependencies.@jixo/opendweb-server-binary=^'"$VER_SB" --prefix packages/opendweb
          grep -r '"@jixo/opendweb' packages/*/package.json
      - name: Verify @jixo/opendweb-config tarball manifest
        run: |
          cd packages/opendweb-config && npm pack --dry-run 2>&1 | tee /tmp/cfg.log
          grep -q "src/index.js" /tmp/cfg.log
          grep -q "README.md" /tmp/cfg.log
      # 单包 patch 发布守卫（v0.3.3 起）：registry 已存在同版本则跳过，
      # 避免单包修复被迫全量 bump（未变更的包撞「版本已存在」中断 job）
      - name: Publish @jixo/opendweb-config
        run: |
          V=$(node -p "require('./package.json').version")
          [ "$(npm view "@jixo/opendweb-config@$V" version 2>/dev/null)" = "$V" ] \
            && echo "skip: already published @$V" || npm publish --access public --provenance
        working-directory: packages/opendweb-config
      - name: Publish @jixo/opendweb-ext-cf
        run: |
          V=$(node -p "require('./package.json').version")
          [ "$(npm view "@jixo/opendweb-ext-cf@$V" version 2>/dev/null)" = "$V" ] \
            && echo "skip: already published @$V" || npm publish --access public --provenance
        working-directory: packages/opendweb-ext-cf
      - name: Publish @jixo/opendweb-server-binary
        run: |
          V=$(node -p "require('./package.json').version")
          [ "$(npm view "@jixo/opendweb-server-binary@$V" version 2>/dev/null)" = "$V" ] \
            && echo "skip: already published @$V" || npm publish --access public --provenance
        working-directory: packages/server-binary
      - name: Publish @jixo/opendweb-client-sdk
        run: |
          V=$(node -p "require('./package.json').version")
          [ "$(npm view "@jixo/opendweb-client-sdk@$V" version 2>/dev/null)" = "$V" ] \
            && echo "skip: already published @$V" || npm publish --access public --provenance
        working-directory: packages/client-sdk
      - name: Publish @jixo/opendweb-example
        run: |
          V=$(node -p "require('./package.json').version")
          [ "$(npm view "@jixo/opendweb-example@$V" version 2>/dev/null)" = "$V" ] \
            && echo "skip: already published @$V" || npm publish --access public --provenance
        working-directory: packages/example
      - name: Publish opendweb (top-level CLI)
        run: |
          V=$(node -p "require('./package.json').version")
          [ "$(npm view "opendweb@$V" version 2>/dev/null)" = "$V" ] \
            && echo "skip: already published @$V" || npm publish --access public --provenance
        working-directory: packages/opendweb

  cut-release:
    # GitHub Release（L1）—— npm 发布成功后自动切出同名 Release；或由
    # workflow_dispatch 引导模式为既有版本补切。notes 按包提炼（tag 区间的
    # 提交按目录分组）+ tag 处各包版本表 + 升级行 + docker 镜像引用。
    needs: publish-npm
    # dispatch 时 publish-npm 被 if 守卫 skip，needs 链会连带 skip —— 必须
    # always() 打开 needs 门，再在表达式里区分两种路径：
    #   a) tag push 且 npm 发布成功；b) 引导模式（不依赖发布结果）
    if: >-
      always() &&
      ((needs.publish-npm.result == 'success' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.release_current))
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release（发布 job 仍只需 read）
    env:
      # 镜像命名空间（2026-09-07 rename 同步）：新构建发布到 jixoai 名下
      # （docker.yml 的 IMAGE_NAME=github.repository 动态解析）；repo 由
      # Gaubee/dweb 改名前的全部 tag 都在 gaubee 名下（已实证
      # 0.4.2/1.0.1-cli/1.0.3-cf/latest 均 200），notes 里作为迁移说明引用。
      DOCKER_IMAGE: ghcr.io/jixoai/opendweb
      DOCKER_IMAGE_LEGACY: ghcr.io/gaubee/dweb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # notes 需要 tag 处的 package.json 与跨 tag 提交区间
      - name: Resolve the release tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            t="${{ inputs.tag }}"
            if [ -z "$t" ]; then
              t="v$(node -p "require('./packages/opendweb/package.json').version")"
            fi
            git rev-parse -q --verify "refs/tags/$t" >/dev/null \
              || { echo "::error::tag $t not found in the repository"; exit 1; }
            echo "tag=$t" >> "$GITHUB_OUTPUT"
          fi
      - name: Compose release notes (per-package + versions + upgrade + docker)
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VER="${TAG#v}"

          # tag 处各包版本表（发布真值）
          pkgver() {
            git show "$TAG:packages/$1/package.json" \
              | node -p "const p=JSON.parse(require('fs').readFileSync(0,'utf8'));p.name+'|'+p.version"
          }
          CLI="$(pkgver opendweb)"; CLI_NAME="${CLI%%|*}"; CLI_VER="${CLI##*|}"
          SDK="$(pkgver client-sdk)"; SDK_NAME="${SDK%%|*}"; SDK_VER="${SDK##*|}"

          {
            echo "Windows artifacts (\`dweb-server\` exe + napi dll) for this tag are built fresh by the release workflow and ship inside the npm tarballs."
            echo
            echo "## npm packages (versions at this tag)"
            echo
            echo "| npm package | version |"
            echo "| --- | --- |"
            for d in opendweb server-binary client-sdk example opendweb-config opendweb-ext-cf; do
              row="$(pkgver "$d")"
              printf '| \`%s\` | %s |\n' "${row%%|*}" "${row##*|}"
            done
            echo

            # 按包提炼：tag 区间提交按目录分组（无前序 tag 时区间=本 tag 提交）
            PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)"
            RANGE="${PREV:+$PREV..}$TAG"
            echo "## Changes${PREV:+ since $PREV}"
            echo
            section() {
              local label="$1"; shift
              local logs
              logs="$(git log --no-merges --format='- %s' "$RANGE" -- "$@")"
              if [ -n "$logs" ]; then printf '### %s\n\n%s\n\n' "$label" "$logs"; fi
            }
            {
              section 'opendweb (CLI)' packages/opendweb
              section '@jixo/opendweb-ext-cf (Cloudflare Tunnel plugin)' packages/opendweb-ext-cf
              section '@jixo/opendweb-client-sdk' packages/client-sdk
              section '@jixo/opendweb-server-binary' packages/server-binary
              section '@jixo/opendweb-example' packages/example
              section '@jixo/opendweb-config' packages/opendweb-config
              section 'fabric kernel & server (crates)' crates
              section 'docker & infra' docker .github scripts
            } > /tmp/sections.md
            if [ -s /tmp/sections.md ]; then cat /tmp/sections.md; else echo "- (no package-scoped commits captured in $RANGE)"; echo; fi

            echo "## Upgrade"
            echo
            echo '```bash'
            echo "npx ${CLI_NAME}@${CLI_VER} server   # or: npm i -g ${CLI_NAME}@${CLI_VER}"
            echo "npm i ${SDK_NAME}@${SDK_VER}        # Node SDK"
            echo '```'
            echo
            echo "## Docker"
            echo
            echo '```bash'
            echo "docker run -d -p 8787:8787 -p 3340:3340 ${DOCKER_IMAGE}:${VER}"
            echo '```'
            echo
            echo "Images for every tag built before the repo rename live under \`${DOCKER_IMAGE_LEGACY}\` (historical tags remain pullable); current builds publish under \`${DOCKER_IMAGE}\`."
          } > /tmp/notes.md
          cat /tmp/notes.md
      - name: Create the GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            --verify-tag \
            --latest
